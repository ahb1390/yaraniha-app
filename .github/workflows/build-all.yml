name: Build All 24 Formats

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Linux (8 formats)
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot flatpak-builder snapcraft

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm ci

      - name: Build Linux packages
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.snap
            release/*.pacman
            release/*.flatpak
            release/*.freebsd
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # JOB 2: Windows (6 formats)
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm ci

      - name: Build Windows packages
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.msi
            release/*.appx
            release/*.exe.blockmap
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # JOB 3: macOS (5 formats)
  # ============================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm ci

      - name: Build macOS packages
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # JOB 4: Android (2 formats)
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Android AAB
        working-directory: ./android
        run: |
          ./gradlew bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # JOB 5: iOS (1 format - unsigned)
  # ============================================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Build iOS (unsigned)
        working-directory: ./ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        working-directory: ./ios/App/build/Build/Products/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r Yaraniha-iOS-unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: ios/App/build/Build/Products/Release-iphoneos/*.ipa
          if-no-files-found: warn
          retention-days: 30

  # ============================================
  # JOB 6: Create GitHub Release
  # ============================================
  release:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }} - All 24 Formats
          draft: false
          prerelease: false
          body: |
            ## 🎉 تمام ۲۴ فرمت خروجی آماده است!

            ### 🐧 لینوکس (8 فرمت):
            - AppImage
            - deb
            - rpm
            - tar.gz
            - snap
            - pacman
            - flatpak
            - freebsd

            ### 🪟 ویندوز (6 فرمت):
            - nsis (نصبی)
            - portable (پرتیبل)
            - msi
            - appx
            - nsis-web
            - squirrelWindows

            ### 🍎 مک (5 فرمت):
            - dmg
            - zip
            - pkg
            - mas
            - mas-dev

            ### 📱 موبایل (3 فرمت):
            - Android APK
            - Android AAB
            - iOS IPA

            **مجموع: 22 فرمت دسکتاپ + 2 فرمت اندروید + 1 فرمت iOS = 24 فرمت**
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
            artifacts/macos-packages/*
            artifacts/android-packages/*
            artifacts/ios-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
