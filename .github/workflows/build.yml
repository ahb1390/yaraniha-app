name: Build and Release All Platforms

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Linux
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install
      - name: Build Linux
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # ✅ اضافه کردن مرحله آپلود Artifact برای لینوکس
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*
          if-no-files-found: error

  # ============================================
  # JOB 2: Windows
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install
      - name: Build Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # ✅ اضافه کردن مرحله آپلود Artifact برای ویندوز
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release/*
          if-no-files-found: error

  # ============================================
  # JOB 3: macOS
  # ============================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install
      - name: Build macOS
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      
      # ✅ اضافه کردن مرحله آپلود Artifact برای مک
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: release/*
          if-no-files-found: error

  # ============================================
  # JOB 4: Create GitHub Release & Upload Assets
  # ============================================
  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ دانلود دقیق Artifactها با نام‌هایی که در بالا تعریف کردیم
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: artifacts/linux-packages
      
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: artifacts/windows-packages
      
      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: artifacts/macos-packages

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }} - All Platforms
          draft: false
          prerelease: true
          generate_release_notes: true
          # ✅ اشاره به مسیری که فایل‌ها دانلود شده‌اند
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
            artifacts/macos-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
