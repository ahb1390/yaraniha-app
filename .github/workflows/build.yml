name: Build All Platforms

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Linux
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # اضافه شدن libarchive-tools برای رفع خطای bsdtar در ساخت pacman
          sudo apt-get install -y rpm fakeroot libarchive-tools

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Build Linux packages
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.pacman
          if-no-files-found: warn

  # ============================================
  # JOB 2: Windows
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Build Windows packages
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*.exe
          if-no-files-found: warn

  # ============================================
  # JOB 3: macOS
  # ============================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Build macOS packages
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  # ============================================
  # JOB 4: Android
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
  # ============================================
  # JOB 5: iOS
  # ============================================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Prepare iOS Platform (Clean Build)
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Debug iOS Directory Structure
        # این مرحله فقط برای اینه که ببینیم دقیقاً چه فایل‌هایی ساخته شدن
        run: |
          echo "=== Listing iOS directory structure ==="
          ls -R ios || echo "ios directory not found!"

      - name: Install CocoaPods Dependencies (Smart Find)
        # به جای حدس زدن مسیر، خود اسکریپت Podfile رو پیدا می‌کنه
        run: |
          # پیدا کردن دایرکتوری حاوی Podfile
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -n 1)

          if [ -z "$PODFILE_DIR" ]; then
            echo "❌ Error: Podfile not found anywhere in the ios directory!"
            echo "This usually means 'npx cap add ios' failed silently or Capacitor config is missing."
            exit 1
          fi

          echo "✅ Found Podfile in: $PODFILE_DIR"
          cd "$PODFILE_DIR"
          pod install

      - name: Build iOS (Unsigned Workaround)
        # مسیر xcworkspace رو هم هوشمند می‌کنیم
        run: |
          WORKSPACE_PATH=$(find ios -name "App.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "❌ Error: App.xcworkspace not found!"
            exit 1
          fi

          WORKSPACE_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORKSPACE_DIR"

          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     PROVISIONING_PROFILE="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create IPA
        run: |
          # پیدا کردن مسیر دقیق App.app
          APP_PATH=$(find ios -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: App.app not found after build!"
            exit 1
          fi

          APP_DIR=$(dirname "$APP_PATH")
          cd "$APP_DIR"

          mkdir -p Payload
          cp -r App.app Payload/
          zip -r Yaraniha-iOS-unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          # استفاده از wildcard برای پیدا کردن فایل ipa در هر عمقی
          path: ios/**/*.ipa
          if-no-files-found: warn
  # ============================================
  # JOB 6: Create GitHub Release
  # ============================================
  release:
    needs: [build-linux, build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }} - All Platforms
          draft: false
          prerelease: false
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
            artifacts/macos-packages/*
            artifacts/android-packages/*
            artifacts/ios-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
