name: Build and Release All Platforms

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ] # تریگر کردن هنگام تگ زدن نسخه
  workflow_dispatch:

jobs:
  # ============================================
  # JOB 1: Linux
  # ============================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install
      - name: Build and Publish Linux
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 2: Windows
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install
      - name: Build and Publish Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # JOB 3: macOS
  # ============================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install
      - name: Build and Publish macOS
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
  # ============================================
  # JOB: Create GitHub Release & Upload Assets
  # ============================================
  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }} - All Platforms
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/linux-packages/*
            artifacts/windows-packages/*
            artifacts/macos-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
