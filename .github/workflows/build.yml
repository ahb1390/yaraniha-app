name: Build and Save to Repo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false # امنیت بیشتر هنگام پوش کردن

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Install npm dependencies
        run: |
          echo "allow-scripts=true" > .npmrc
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Build Desktop Apps
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            npm run dist:linux
          elif [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win
          else
            npm run dist:mac
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false # غیرفعال کردن امضای مک برای جلوگیری از خطا

      - name: Collect Artifacts into /dist folder
        run: |
          mkdir -p dist/${{ runner.os }}
          cp release/* dist/${{ runner.os }}/ || true
          
      - name: Upload Dist Folder as Artifact (Temporary)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: dist/
          retention-days: 1

  # ============================================
  # JOB: Merge all artifacts and push to repo
  # ============================================
  save-to-repo:
    needs: build-all
    runs-on: ubuntu-latest
    permissions:
      contents: write # اجازه نوشتن در مخزن
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-Linux
          path: temp-dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-Windows
          path: temp-dist

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macOS
          path: temp-dist

      - name: Merge into /dist folder
        run: |
          mkdir -p dist
          cp -r temp-dist/dist/Linux/* dist/ || true
          cp -r temp-dist/dist/Windows/* dist/ || true
          cp -r temp-dist/dist/macOS/* dist/ || true
          rm -rf temp-dist

      - name: Commit and Push to Repository
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add dist/
          # فقط اگر تغییری وجود داشت کامیت کن
          if ! git diff --staged --quiet; then
            git commit -m "chore: update build artifacts [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes in dist folder, skipping commit."
          fi